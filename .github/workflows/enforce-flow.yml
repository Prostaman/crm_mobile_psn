name: Enforce Branch Flow

on:
  pull_request:
    branches:
      - main
      - testing

jobs:
  check-branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch for main
        if: github.base_ref == 'main' && github.head_ref != 'testing'
        run: |
          echo "Error: Merging into 'main' is only allowed from the 'testing' branch."
          echo "Current source branch: ${{ github.head_ref }}"
          exit 1

      - name: Verify source branch for testing
        if: github.base_ref == 'testing' && github.head_ref != 'development'
        run: |
          echo "Error: Merging into 'testing' is only allowed from the 'development' branch."
          echo "Current source branch: ${{ github.head_ref }}"
          exit 1

      - name: Flow is correct
        run: echo "Branch flow sequence is correct."
