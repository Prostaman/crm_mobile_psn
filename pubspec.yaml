name: psn.hotels.hub
description: The PSN Hotels application is your indispensable tool for working with hotel photos. Designed specifically for managers of the “Come with us” travel network, this application allows you not only to conveniently store all the necessary photos and video materials in one place, but also to effectively share them through social networks and instant messengers.

publish_to: 'none'
version: 1.26.2+53

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  workmanager: ^0.9.0+3
  webview_flutter: ^4.9.0
  sqflite: ^2.4.1
  image_cropper:  ^12.2.1
  share_plus: ^12.0.2
  reflectable: ^4.0.15
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^9.1.1
  dart_json_mapper_flutter: ^2.0.1
  location: ^8.0.1
  geolocator: ^14.0.1
  equatable: ^2.0.7
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2

  #for checking internet connection
  connectivity_plus: ^7.1.1

  #camera
  camera: ^0.12.0+1
  camera_android_camerax: ^0.7.2
  video_compress: ^3.1.2
  photo_view: ^0.15.0
  chewie: ^1.10.0
  video_player: ^2.9.2
  permission_handler: ^12.0.1
  app_settings: ^7.0.0
  gallery_saver_plus: ^3.2.9
  open_file: ^3.5.10
  sensors_plus: ^7.0.0

  percent_indicator: ^4.2.3
  package_info_plus: ^9.0.1
  cupertino_icons: ^1.0.8

  #for actions with items in lists
  flutter_slidable: ^4.0.3

  #analytic and crashlytics
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3
  firebase_core: ^4.2.0

  app_tracking_transparency: ^2.0.4
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.2
  device_info_plus: ^12.4.0
  app_version_update: ^6.2.0
  flutter_image_compress: ^2.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

dependency_overrides:
  url_launcher_ios: ^6.3.4

flutter_launcher_icons:
  image_path: "assets/app/icon_launcher.jpg"
  android: true
  ios: true
  adaptive_icon_background: "assets/app/icon_background.png" # Картинка фона (без логотипа)
  adaptive_icon_foreground: "assets/app/icon_foreground.png" # Картинка логотипа (на прозрачном фоне)

flutter:

  assets:
    - assets/icons/

  fonts:
    - family: SFUIDisplay
      fonts:
        - asset: fonts/SFUIDisplay-Black.ttf
          weight: 900
        - asset: fonts/SFUIDisplay-Bold.ttf
          weight: 700
        - asset: fonts/SFUIDisplay-Heavy.ttf
          weight: 800
        - asset: fonts/SFUIDisplay-Light.ttf
          weight: 300
        - asset: fonts/SFUIDisplay-Medium.ttf
          weight: 500
        - asset: fonts/SFUIDisplay-Regular.ttf
        - asset: fonts/SFUIDisplay-Semibold.ttf
          weight: 600
        - asset: fonts/SFUIDisplay-Thin.ttf
          weight: 100
        - asset: fonts/SFUIDisplay-Ultralight.ttf
          weight: 200

  uses-material-design: true


flutter_native_splash:
  background_image: assets/app/background_image_splash_screen.jpg
  fullscreen: true